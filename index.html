<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zer0Life Run - Onboarding</title>
    <!-- Подключаем шрифты для точного попадания в дизайн -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            background-color: #000;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        /* Шрифты для логотипа */
        .font-zerolife {
            font-family: 'Montserrat', sans-serif;
        }
        .font-run {
            font-family: 'Permanent Marker', cursive;
        }

        /* Фоновая картинка с котом */
        .bg-cat-image {
            /* ВСТАВЬ СЮДА ССЫЛКУ НА СВОЮ КАРТИНКУ С КОТОМ */
            background-image: url('https://placehold.co/1080x1920/1a1a2e/ffffff?text=YOUR+CAT+IMAGE+HERE');
            background-size: cover;
            background-position: center;
        }

        /* Цвета кнопок */
        .btn-green {
            background-color: #9bf864; /* Светло-зеленый цвет из макета */
            color: #000000;
        }
        .btn-telegram {
            background-color: #151a25; /* Темно-синий/серый цвет кнопки */
            color: #ffffff;
        }
    </style>
</head>
<body class="h-screen w-full flex justify-center items-center overflow-hidden">

    <div class="w-full max-w-md h-full relative flex flex-col justify-between bg-cat-image shadow-2xl">
        
        <!-- Затемнение снизу, чтобы текст читался идеально -->
        <div class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent pointer-events-none"></div>

        <!-- ==================== HEADER ==================== -->
        <header class="relative z-10 flex justify-between items-center px-5 pt-10 pb-4">
            <button class="text-white text-sm font-medium hover:opacity-70 transition-opacity">
                Close
            </button>
            <div class="text-center mt-1">
                <h1 class="text-white text-[15px] font-bold tracking-wide">Zer0Life Run</h1>
                <p class="text-gray-400 text-[10px] uppercase tracking-widest">mini app</p>
            </div>
            <!-- Иконка 4 точки -->
            <button class="text-white hover:opacity-70 transition-opacity">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="7" r="1.5" fill="currentColor"/>
                    <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
                    <circle cx="12" cy="17" r="1.5" fill="currentColor"/>
                    <circle cx="17" cy="12" r="1.5" fill="currentColor"/>
                    <circle cx="7" cy="12" r="1.5" fill="currentColor"/>
                </svg>
            </button>
        </header>

        <!-- ==================== BOTTOM CONTENT ==================== -->
        <main class="relative z-10 px-6 pb-12 flex flex-col items-center w-full mt-auto">
            
            <!-- Логотип (ZER0LIFE RUN) -->
            <div class="flex flex-col items-center mb-10 w-full transform -rotate-2">
                <h2 class="font-zerolife text-5xl italic font-black text-white tracking-tighter" style="line-height: 0.9;">
                    ZERØLIFE
                </h2>
                <h2 class="font-run text-[64px] text-[#9bf864] -mt-3 drop-shadow-md">
                    RUN
                </h2>
                <p class="text-white text-[10px] font-bold tracking-[0.3em] uppercase mt-1">
                    Move to earn
                </p>
            </div>

            <!-- Кнопки действий -->
            <div class="w-full space-y-3">
                <!-- Get Started -->
                <button class="w-full btn-green font-bold text-[15px] py-4 rounded-[14px] transition-transform active:scale-95 shadow-lg">
                    Get Started
                </button>
                
                <!-- Login with Telegram -->
                <button class="w-full btn-telegram font-medium text-[14px] py-4 rounded-[14px] flex items-center justify-center space-x-2 transition-transform active:scale-95 border border-white/5">
                    <!-- Иконка Telegram -->
                    <svg class="w-5 h-5 text-[#40b3e6]" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .24z"/>
                    </svg>
                    <span>Login with Telegram</span>
                </button>
            </div>

        </main>
    </div>

</body>
</html>
