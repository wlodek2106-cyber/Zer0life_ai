<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zer0life Run v3</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Библиотека Solana Web3 для фронтенда -->
    <script src="https://unpkg.com/@solana/web3.js@1.87.6/lib/index.iife.min.js"></script>
    <style>
        :root {
            --bg-base: #030305;
            --card-surface: #0a0a0f;
            --border-neon: #00ff66;
            --accent-green: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.4);
            --danger-red: #ff0055;
            --text-primary: #ffffff;
            --text-secondary: #8b8b9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(0, 255, 102, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 120%, rgba(255, 0, 85, 0.15) 0%, transparent 50%);
        }

        .header {
            text-align: center;
            width: 100%;
            max-width: 380px;
        }

        .brand-badge {
            display: inline-block;
            background: rgba(0, 255, 102, 0.1);
            color: var(--accent-green);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 3px;
            padding: 4px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 4px;
            border: 1px solid var(--border-neon);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }

        h1 {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-style: italic;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
        }

        .gear-card-new {
            width: 100%;
            max-width: 380px;
            height: 82px;
            background: linear-gradient(135deg, #12121c, #08080c);
            border: 2px dashed rgba(0, 255, 102, 0.4);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            margin: 6px 0;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.1);
        }

        .gear-card-new::before {
            content: 'ZER0LIFE';
            position: absolute;
            right: -5px;
            bottom: -8px;
            font-size: 38px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.02);
            font-style: italic;
            pointer-events: none;
        }

        .gear-info h4 {
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-green);
        }

        .gear-info p {
            font-size: 9px;
            color: var(--text-secondary);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .gear-visual-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .character-box {
            width: 45px;
            height: 55px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .runner-svg {
            width: 42px;
            height: 55px;
            transform-origin: bottom center;
        }

        .running-active .body-group {
            animation: bodyRun 0.35s infinite alternate ease-in-out;
        }
        .running-active .leg-left {
            animation: legLeftRun 0.35s infinite ease-in-out;
        }
        .running-active .leg-right {
            animation: legRightRun 0.35s infinite ease-in-out;
        }
        .running-active .arm-left {
            animation: armLeftRun 0.35s infinite ease-in-out;
        }
        .running-active .arm-right {
            animation: armRightRun 0.35s infinite ease-in-out;
        }

        @keyframes bodyRun {
            0% { transform: translateY(0px) rotate(-3deg); }
            100% { transform: translateY(-4px) rotate(3deg); }
        }
        @keyframes legLeftRun {
            0% { transform: rotate(-35deg); transform-origin: 28px 40px; }
            100% { transform: rotate(35deg); transform-origin: 28px 40px; }
        }
        @keyframes legRightRun {
            0% { transform: rotate(35deg); transform-origin: 28px 40px; }
            100% { transform: rotate(-35deg); transform-origin: 28px 40px; }
        }
        @keyframes armLeftRun {
            0% { transform: rotate(30deg); transform-origin: 32px 22px; }
            100% { transform: rotate(-30deg); transform-origin: 32px 22px; }
        }
        @keyframes armRightRun {
            0% { transform: rotate(-30deg); transform-origin: 32px 22px; }
            100% { transform: rotate(30deg); transform-origin: 32px 22px; }
        }

        .main-card {
            width: 100%;
            max-width: 380px;
            background: var(--card-surface);
            border: 1px solid rgba(0, 255, 102, 0.3);
            border-radius: 22px;
            padding: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .main-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--danger-red), var(--accent-green));
            border-radius: 22px 22px 0 0;
        }

        .balance-section {
            text-align: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .balance-label {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
        }

        .balance-value {
            font-size: 36px;
            font-weight: 900;
            color: var(--accent-green);
            text-shadow: 0 0 30px var(--accent-glow);
            font-style: italic;
            margin-top: 2px;
        }

        .metric-group {
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .metric-label {
            font-size: 10px;
            color: var(--text-secondary);
            font-weight: 700;
            text-transform: uppercase;
        }

        .metric-value {
            font-size: 14px;
            font-weight: 900;
            color: var(--text-primary);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            transition: background-color 0.3s;
        }

        .pulse-dot.active {
            background-color: var(--accent-green);
            box-shadow: 0 0 15px var(--accent-green);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.6); opacity: 0.3; }
            100% { transform: scale(1); opacity: 1; }
        }

        .actions {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            width: 100%;
            background: var(--accent-green);
            color: #030305;
            border: none;
            border-radius: 14px;
            padding: 13px;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 25px rgba(0, 255, 102, 0.4);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: #13131c;
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: none;
        }

        .btn-danger {
            background: var(--danger-red);
            box-shadow: 0 4px 25px rgba(255, 0, 85, 0.5);
            color: #ffffff;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 5, 0.9);
            backdrop-filter: blur(12px);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }
        .modal-content {
            background: var(--card-surface);
            border: 1px solid var(--border-neon);
            border-radius: 20px;
            padding: 22px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
        }
        .modal-content h3 {
            margin-bottom: 10px;
            font-size: 16px;
            text-transform: uppercase;
            font-weight: 900;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-badge">Solana Network</div>
        <h1>Zer0life Run</h1>
    </div>

    <div class="gear-card-new">
        <div class="gear-info">
            <h4>ZEROLIFE GEAR</h4>
            <p>MOVE TO EARN • ZRL TOKEN</p>
        </div>
        <div class="gear-visual-box">
            <div class="character-box">
                <svg class="runner-svg" id="runnerAvatar" viewBox="0 0 60 75">
                    <g class="body-group">
                        <rect x="22" y="22" width="16" height="20" rx="4" fill="#15151a" stroke="#00ff66" stroke-width="1.5"/>
                        <circle cx="30" cy="28" r="2.5" fill="#00ff66"/>
                        <circle cx="30" cy="12" r="6" fill="#fcd0a1"/>
                        <path d="M22 10 C22 6, 38 6, 38 10 Z" fill="#030305"/>
                        <path d="M34 9 L43 10.5 L34 12 Z" fill="#00ff66"/>
                        <g class="arm-left">
                            <line x1="22" y1="24" x2="12" y2="35" stroke="#15151a" stroke-width="4" stroke-linecap="round"/>
                            <circle cx="12" cy="36" r="2.5" fill="#fcd0a1"/>
                        </g>
                        <g class="arm-right">
                            <line x1="38" y1="24" x2="48" y2="35" stroke="#15151a" stroke-width="4" stroke-linecap="round"/>
                            <circle cx="48" cy="36" r="2.5" fill="#fcd0a1"/>
                        </g>
                    </g>
                    <g class="leg-left">
                        <rect x="25" y="40" width="6" height="12" fill="#00ff66"/>
                        <line x1="28" y1="52" x2="24" y2="62" stroke="#111" stroke-width="4" stroke-linecap="round"/>
                        <path d="M21 62 L28 62 L29 66 L20 66 Z" fill="#ffffff" stroke="#00ff66" stroke-width="1"/>
                    </g>
                    <g class="leg-right">
                        <rect x="29" y="40" width="6" height="12" fill="#00ff66"/>
                        <line x1="32" y1="52" x2="36" y2="62" stroke="#111" stroke-width="4" stroke-linecap="round"/>
                        <path d="M33 62 L40 62 L41 66 L32 66 Z" fill="#ffffff" stroke="#00ff66" stroke-width="1"/>
                    </g>
                </svg>
            </div>
            <span style="font-size: 18px;">⚡</span>
        </div>
    </div>

    <div class="main-card">
        <div class="balance-section">
            <div class="balance-label">Total ZRL Balance</div>
            <div class="balance-value" id="totalBalance">0</div>
        </div>

        <div class="metric-group">
            <span class="metric-label">Distance</span>
            <span class="metric-value" id="currentDist">0.00 km</span>
        </div>

        <div class="metric-group">
            <span class="metric-label">Session Reward</span>
            <span class="metric-value" id="currentReward">0 ZRL</span>
        </div>

        <div class="status-indicator">
            <div class="pulse-dot" id="statusDot"></div>
            <span id="statusText">Ready to start</span>
        </div>
    </div>

    <div class="actions">
        <button class="btn" id="actionBtn" onclick="toggleRun()">Start Run</button>
        <button class="btn btn-secondary" onclick="openWithdrawModal()">Withdraw to Phantom (Solana)</button>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="withdrawModal">
        <div class="modal-content">
            <h3>Withdraw ZRL to Solana</h3>
            <p style="font-size: 10px; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase;">
                Phantom connection is required to pay network fee.
            </p>
            <button class="btn" onclick="submitWithdraw()">Connect & Withdraw</button>
            <button class="btn btn-secondary" style="margin-top: 6px;" onclick="closeWithdrawModal()">Cancel</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let isRunning = false;
        let watchId = null;
        let sessionDistance = 0;
        let lastPosition = null;

        let userBalance = parseFloat(localStorage.getItem('zrl_balance')) || 0;
        updateBalanceUI();

        function updateBalanceUI() {
            document.getElementById('totalBalance').innerText = Math.floor(userBalance);
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function toggleRun() {
            const btn = document.getElementById('actionBtn');
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            const avatarSvg = document.getElementById('runnerAvatar');

            if (!isRunning) {
                if (!navigator.geolocation) {
                    alert("Geolocation is not supported by your device");
                    return;
                }

                isRunning = true;
                sessionDistance = 0;
                lastPosition = null;

                avatarSvg.classList.add('running-active');

                btn.innerText = "End and Save ZRL";
                btn.className = "btn btn-danger";
                dot.classList.add('active');
                text.innerText = "Searching for GPS satellites...";

                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const { latitude, longitude, accuracy } = position.coords;
                        text.innerText = `GPS active (accuracy: ${Math.round(accuracy)}m)`;

                        if (accuracy > 70) return;

                        if (lastPosition) {
                            const dist = calculateDistance(lastPosition.lat, lastPosition.lon, latitude, longitude);
                            if (dist > 0.003) { 
                                sessionDistance += dist;
                                updateSessionUI();
                            }
                        }
                        lastPosition = { lat: latitude, lon: longitude };
                    },
                    (error) => {
                        console.warn(error);
                        text.innerText = "⚠️ GPS Error. Check permissions.";
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
                );

            } else {
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                }
                isRunning = false;

                avatarSvg.classList.remove('running-active');

                const earnedZrl = Math.floor(sessionDistance * 500);
                userBalance += earnedZrl;
                localStorage.setItem('zrl_balance', userBalance);
                updateBalanceUI();

                btn.innerText = "Start Run";
                btn.className = "btn";
                dot.classList.remove('active');
                text.innerText = "Workout saved!";

                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }

                alert(`Success! ${earnedZrl} ZRL credited to your balance.`);
                sessionDistance = 0;
                updateSessionUI();
            }
        }

        function updateSessionUI() {
            document.getElementById('currentDist').innerText = sessionDistance.toFixed(2) + " km";
            const earnedZrl = Math.floor(sessionDistance * 500);
            document.getElementById('currentReward').innerText = earnedZrl + " ZRL";
        }

        function openWithdrawModal() {
            document.getElementById('withdrawModal').style.display = 'flex';
        }

        function closeWithdrawModal() {
            document.getElementById('withdrawModal').style.display = 'none';
        }

        // --- ИСПРАВЛЕННАЯ ФУНКЦИЯ ВЫВОДА С АВТОМАТИЧЕСКИМ ОТКРЫТИЕМ PHANTOM ---
        async function submitWithdraw() {
            const API_URL = 'https://zer0life-ai-iz5n.onrender.com/withdraw'; 
            
            if (userBalance <= 0) {
                alert("У вас нет токенов ZRL на балансе для вывода.");
                return;
            }

            // Если открыто внутри Telegram, автоматически перенаправляем в Phantom через Deep Link
            const isTelegramMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) && !window.solana && !window.phantom;
            
            if (isTelegramMobile) {
                const appUrl = window.location.href;
                window.location.href = `https://phantom.app/ul/browse/${encodeURIComponent(appUrl)}?ref=${encodeURIComponent(appUrl)}`;
                return;
            }

            const provider = window.phantom?.solana || window.solana;
            if (!provider) {
                alert("Пожалуйста, откройте мини-приложение через встроенный браузер Phantom Wallet.");
                return;
            }

            try {
                const resp = await provider.connect();
                const userWalletAddress = resp.publicKey.toString();

                alert("Формирование транзакции... Подтвердите оплату комиссии в кошельке Phantom.");
                
                // 1. Запрашиваем полуготовую транзакцию у вашего Python-бота
                const serverResponse = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        walletAddress: userWalletAddress,
                        amount: Math.floor(userBalance)
                    })
                });

                const data = await serverResponse.json();
                if (data.error) throw new Error(data.error);

                // 2. Декодируем транзакцию для браузера
                const txBuffer = Uint8Array.from(atob(data.transaction), c => c.charCodeAt(0));
                const transaction = solanaWeb3.Transaction.from(txBuffer);

                // 3. Открываем Phantom, чтобы игрок оплатил комиссию сети (fee_payer)
                const { signature } = await provider.signAndSendTransaction(transaction);
                
                // 4. Ждем подтверждения от сети Solana
                const connection = new solanaWeb3.Connection('https://api.mainnet-beta.solana.com');
                await connection.confirmTransaction(signature);
                
                alert(`Успех! Токены выведены. Хэш: ${signature}`);
                
                // Обнуляем баланс
                userBalance = 0;
                localStorage.setItem('zrl_balance', userBalance);
                updateBalanceUI();
                closeWithdrawModal();

            } catch (err) {
                console.error(err);
                alert("Ошибка: " + err.message);
            }
        }
    </script>
</body>
</html>
