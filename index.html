<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zer0life Run - Onboarding</title>
    <!-- Подключаем библиотеку Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем премиум-шрифт из макета -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #05070a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .main-container {
            flex-grow: 1;
            /* Твоя ссылка на изображение кота */
            background-image: url('https://i.postimg.cc/J00FbBRZ/IMG-8899.jpg'); 
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        /* Плавный темный градиент для читаемости текста (как на макете) */
        .main-container::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, #05070a 15%, rgba(5,7,10,0.8) 40%, transparent 100%);
            z-index: 1;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 2;
            padding: 0 24px 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
        }

        .title-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 36px;
            line-height: 0.95;
            font-family: 'Montserrat', sans-serif;
        }

        .title-white {
            color: #ffffff;
            font-size: 52px;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .title-green {
            color: #9bf864; /* Точный неоновый цвет из твоего макета */
            font-size: 52px;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
            margin-top: -2px;
        }

        .subtitle {
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3em; /* Увеличенное расстояние между буквами */
            text-transform: uppercase;
            margin-top: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 14px;
            border: none;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s ease-in-out;
            box-shadow: 0 4px 20px rgba(155, 248, 100, 0.2);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background-color: #9bf864;
            color: #000000;
        }
    </style>
</head>
<body>

    <div class="main-container" id="welcome-screen">
        <div class="content">
            <!-- Блок с логотипом -->
            <div class="title-group">
                <div class="title-white">ZERØLIFE</div>
                <div class="title-green">RUN</div>
                <div class="subtitle">Move to Earn</div>
            </div>

            <!-- Кнопка старта -->
            <button class="btn btn-primary" id="start-btn">
                Get Started
            </button>
        </div>
    </div>

    <script>
        // Инициализируем Telegram Web App
        const tg = window.Telegram.WebApp;
        
        // Разворачиваем приложение на весь экран телефона
        tg.expand(); 
        tg.ready(); 

        const startBtn = document.getElementById('start-btn');

        // Обработчик нажатия на кнопку "Get Started"
        startBtn.addEventListener('click', () => {
            // Легкая вибрация телефона при клике
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
            
            // Визуальный отклик кнопки
            startBtn.innerText = "Loading...";
            startBtn.style.opacity = "0.7";

            // Небольшая задержка для плавности, затем перенаправление на дашборд
            setTimeout(() => {
                window.location.href = "dashboard.html";
            }, 500);
        });
    </script>

</body>
</html>
