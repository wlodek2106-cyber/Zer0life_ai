<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zer0life Run</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-base: #030305;
            --card-surface: #0a0a0f;
            --border-neon: #00ff66;
            --accent-green: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.4);
            --danger-red: #ff0055;
            --text-primary: #ffffff;
            --text-secondary: #8b8b9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 16px;
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(0, 255, 102, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 120%, rgba(255, 0, 85, 0.15) 0%, transparent 50%);
        }

        .header {
            text-align: center;
            width: 100%;
            max-width: 380px;
        }

        .brand-badge {
            display: inline-block;
            background: rgba(0, 255, 102, 0.1);
            color: var(--accent-green);
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 3px;
            padding: 6px 16px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 8px;
            border: 1px solid var(--border-neon);
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.2);
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-style: italic;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
        }

        /* Брендовый арт-баннер */
        .brand-art-banner {
            width: 100%;
            max-width: 380px;
            height: 85px;
            background: linear-gradient(135deg, #12121c, #08080c);
            border: 2px dashed rgba(0, 255, 102, 0.4);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            margin: 10px 0;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0, 255, 102, 0.1);
        }

        .brand-art-banner::before {
            content: 'ZER0LIFE';
            position: absolute;
            right: -10px;
            bottom: -15px;
            font-size: 45px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.03);
            font-style: italic;
            pointer-events: none;
        }

        .art-icon {
            font-size: 34px;
            filter: drop-shadow(0 0 10px var(--accent-green));
        }

        .art-info h4 {
            font-size: 13px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--accent-green);
        }

        .art-info p {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .main-card {
            width: 100%;
            max-width: 380px;
            background: var(--card-surface);
            border: 1px solid rgba(0, 255, 102, 0.3);
            border-radius: 24px;
            padding: 22px 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .main-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--danger-red), var(--accent-green));
            border-radius: 24px 24px 0 0;
        }

        .balance-section {
            text-align: center;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .balance-label {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
        }

        .balance-value {
            font-size: 42px;
            font-weight: 900;
            color: var(--accent-green);
            text-shadow: 0 0 30px var(--accent-glow);
            font-style: italic;
            margin-top: 2px;
        }

        .metric-group {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .metric-label {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 700;
            text-transform: uppercase;
        }

        .metric-value {
            font-size: 15px;
            font-weight: 900;
            color: var(--text-primary);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            transition: background-color 0.3s;
        }

        .pulse-dot.active {
            background-color: var(--accent-green);
            box-shadow: 0 0 15px var(--accent-green);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.6); opacity: 0.3; }
            100% { transform: scale(1); opacity: 1; }
        }

        .actions {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            width: 100%;
            background: var(--accent-green);
            color: #030305;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 25px rgba(0, 255, 102, 0.4);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: #13131c;
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: none;
        }

        .btn-danger {
            background: var(--danger-red);
            box-shadow: 0 4px 25px rgba(255, 0, 85, 0.5);
            color: #ffffff;
        }

        /* Модалка */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 5, 0.9);
            backdrop-filter: blur(12px);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }
        .modal-content {
            background: var(--card-surface);
            border: 1px solid var(--border-neon);
            border-radius: 22px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9);
        }
        .modal-content h3 {
            margin-bottom: 12px;
            font-size: 18px;
            text-transform: uppercase;
            font-weight: 900;
            font-style: italic;
        }
        .modal-input {
            width: 100%;
            background: #030305;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 14px;
            color: #fff;
            font-size: 13px;
            margin-bottom: 15px;
            outline: none;
        }
        .modal-input:focus {
            border-color: var(--accent-green);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-badge">Solana Network</div>
        <h1>Zer0life Run</h1>
    </div>

    <!-- Брендовый арт-баннер -->
    <div class="brand-art-banner">
        <div class="art-info">
            <h4>Zer0Life Gear</h4>
            <p>Move to Earn • ZRL Token</p>
        </div>
        <div class="art-icon">👟⚡</div>
    </div>

    <div class="main-card">
        <!-- Общий баланс токенов -->
        <div class="balance-section">
            <div class="balance-label">Общий баланс ZRL</div>
            <div class="balance-value" id="totalBalance">0</div>
        </div>

        <div class="metric-group">
            <span class="metric-label">Дистанция</span>
            <span class="metric-value" id="currentDist">0.00 км</span>
        </div>

        <div class="metric-group">
            <span class="metric-label">Награда сессии</span>
            <span class="metric-value" id="currentReward">0 ZRL</span>
        </div>

        <div class="status-indicator">
            <div class="pulse-dot" id="statusDot"></div>
            <span id="statusText">Готов к старту</span>
        </div>
    </div>

    <div class="actions">
        <button class="btn" id="actionBtn" onclick="toggleRun()">Начать пробежку</button>
        <button class="btn btn-secondary" onclick="openWithdrawModal()">Вывод на Phantom (Solana)</button>
    </div>

    <!-- Модальное окно вывода -->
    <div class="modal" id="withdrawModal">
        <div class="modal-content">
            <h3>Вывод ZRL в Solana</h3>
            <p style="font-size: 11px; color: var(--text-secondary); margin-bottom: 15px; text-transform: uppercase;">Введите ваш адрес кошелька Phantom.</p>
            <input type="text" id="solanaAddress" class="modal-input" placeholder="Solana адрес...">
            <button class="btn" onclick="submitWithdraw()">Запросить вывод</button>
            <button class="btn btn-secondary" style="margin-top: 8px;" onclick="closeWithdrawModal()">Отмена</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let isRunning = false;
        let watchId = null;
        let sessionDistance = 0;
        let lastPosition = null;
        let lastTime = null;

        let userBalance = parseFloat(localStorage.getItem('zrl_balance')) || 0;
        updateBalanceUI();

        function updateBalanceUI() {
            document.getElementById('totalBalance').innerText = Math.floor(userBalance);
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function toggleRun() {
            const btn = document.getElementById('actionBtn');
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (!isRunning) {
                if (!navigator.geolocation) {
                    alert("Геолокация не поддерживается вашим устройством");
                    return;
                }

                isRunning = true;
                sessionDistance = 0;
                lastPosition = null;
                lastTime = null;

                btn.innerText = "Завершить и сохранить ZRL";
                btn.className = "btn btn-danger";
                dot.classList.add('active');
                text.innerText = "Античит активен (бег)...";

                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const { latitude, longitude, accuracy } = position.coords;
                        const currentTime = Date.now();
                        
                        if (accuracy > 20) return;

                        if (lastPosition && lastTime) {
                            const dist = calculateDistance(lastPosition.lat, lastPosition.lon, latitude, longitude);
                            const timeDiffHours = (currentTime - lastTime) / (1000 * 60 * 60);
                            
                            if (timeDiffHours > 0) {
                                const speedKmh = dist / timeDiffHours;
                                if (speedKmh > 17) {
                                    text.innerText = "⚠️ Слишком быстро (самокат)! Сбавьте темп.";
                                    lastPosition = { lat: latitude, lon: longitude };
                                    lastTime = currentTime;
                                    return;
                                } else {
                                    text.innerText = "Трекинг активен (бег)...";
                                }
                            }

                            if (dist > 0.01) { 
                                sessionDistance += dist;
                                updateSessionUI();
                            }
                        }

                        lastPosition = { lat: latitude, lon: longitude };
                        lastTime = currentTime;
                    },
                    (error) => {
                        console.error(error);
                        alert("Включите GPS-модуль.");
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            } else {
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                }
                isRunning = false;

                const earnedZrl = Math.floor(sessionDistance * 500);
                userBalance += earnedZrl;
                localStorage.setItem('zrl_balance', userBalance);
                updateBalanceUI();

                btn.innerText = "Начать пробежку";
                btn.className = "btn";
                dot.classList.remove('active');
                text.innerText = "Тренировка сохранена!";

                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }

                alert(`Успех! На ваш баланс зачислено ${earnedZrl} ZRL.`);
                sessionDistance = 0;
                updateSessionUI();
            }
        }

        function updateSessionUI() {
            document.getElementById('currentDist').innerText = sessionDistance.toFixed(2) + " км";
            const earnedZrl = Math.floor(sessionDistance * 500);
            document.getElementById('currentReward').innerText = earnedZrl + " ZRL";
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function openWithdrawModal() {
            document.getElementById('withdrawModal').style.display = 'flex';
        }

        function closeWithdrawModal() {
            document.getElementById('withdrawModal').style.display = 'none';
        }

        function submitWithdraw() {
            const address = document.getElementById('solanaAddress').value.trim();
            if (address.length < 30) {
                alert("Введите корректный Solana адрес кошелька Phantom.");
                return;
            }
            if (userBalance <= 0) {
                alert("У вас нет токенов ZRL на балансе для вывода.");
                return;
            }

            alert(`Запрос на вывод ${Math.floor(userBalance)} ZRL на кошелек ${address.substring(0, 6)}... отправлен.`);
            userBalance = 0;
            localStorage.setItem('zrl_balance', userBalance);
            updateBalanceUI();
            closeWithdrawModal();
        }
    </script>
</body>
</html>
