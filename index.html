<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zer0Life Run</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-base: #060608;
            --card-surface: #101015;
            --border-color: #22222f;
            --accent-green: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.15);
            --text-primary: #f3f3f6;
            --text-secondary: #7e7e93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 20px;
        }

        .header {
            text-align: center;
            margin-top: 10px;
        }

        .brand-badge {
            display: inline-block;
            background: rgba(0, 255, 102, 0.1);
            color: var(--accent-green);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 6px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 12px;
            border: 1px solid rgba(0, 255, 102, 0.2);
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .main-card {
            width: 100%;
            max-width: 380px;
            background: var(--card-surface);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 28px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .main-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-green), transparent);
        }

        .metric-group {
            margin-bottom: 20px;
        }

        .metric-group:last-child {
            margin-bottom: 0;
        }

        .metric-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .metric-value {
            font-size: 36px;
            font-weight: 800;
            color: var(--accent-green);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 16px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            transition: background-color 0.3s;
        }

        .pulse-dot.active {
            background-color: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .actions {
            width: 100%;
            max-width: 380px;
            margin-bottom: 10px;
        }

        .btn {
            width: 100%;
            background: var(--accent-green);
            color: #060608;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s, opacity 0.2s;
            box-shadow: 0 4px 20px rgba(0, 255, 102, 0.3);
        }

        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-danger {
            background: #ff334b;
            box-shadow: 0 4px 20px rgba(255, 51, 75, 0.3);
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-badge">Zer0Life Labs</div>
        <h1>Run Tracker</h1>
    </div>

    <div class="main-card">
        <div class="metric-group">
            <div class="metric-label">Дистанция</div>
            <div class="metric-value" id="distance">0.00 <span style="font-size: 18px; font-weight: 500;">км</span></div>
        </div>

        <div style="height: 1px; background: var(--border-color); margin: 20px 0;"></div>

        <div class="metric-group">
            <div class="metric-label">Награда ZRL</div>
            <div class="metric-value" id="reward">0 <span style="font-size: 18px; font-weight: 500;">ZRL</span></div>
        </div>

        <div class="status-indicator">
            <div class="pulse-dot" id="statusDot"></div>
            <span id="statusText">Ожидание старта</span>
        </div>
    </div>

    <div class="actions">
        <button class="btn" id="actionBtn" onclick="toggleRun()">Начать пробежку</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let isRunning = false;
        let watchId = null;
        let totalDistance = 0;
        let lastPosition = null;

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function toggleRun() {
            const btn = document.getElementById('actionBtn');
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (!isRunning) {
                if (!navigator.geolocation) {
                    alert("Геолокация не поддерживается вашим устройством");
                    return;
                }

                isRunning = true;
                totalDistance = 0;
                lastPosition = null;

                btn.innerText = "Завершить и забрать";
                btn.className = "btn btn-danger";
                dot.classList.add('active');
                text.innerText = "Трекинг активен (на улице)...";

                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const { latitude, longitude, accuracy } = position.coords;
                        
                        // Игнорируем плохой сигнал в помещении (если точность хуже 20 метров)
                        if (accuracy > 20) {
                            return;
                        }

                        if (lastPosition) {
                            const dist = calculateDistance(lastPosition.lat, lastPosition.lon, latitude, longitude);
                            
                            // Учитываем реальное движение только если прошли больше 10 метров за такт
                            if (dist > 0.01) { 
                                totalDistance += dist;
                                updateUI();
                            }
                        }
                        lastPosition = { lat: latitude, lon: longitude };
                    },
                    (error) => {
                        console.error(error);
                        alert("Включите GPS-модуль для отслеживания пробежки.");
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            } else {
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                }
                isRunning = false;

                const finalData = {
                    distance: parseFloat(totalDistance.toFixed(2)),
                    reward: Math.floor(totalDistance * 500)
                };

                tg.sendData(JSON.stringify(finalData));
                tg.close();
            }
        }

        function updateUI() {
            document.getElementById('distance').innerHTML = totalDistance.toFixed(2) + ' <span style="font-size: 18px; font-weight: 500;">км</span>';
            const earnedZrl = Math.floor(totalDistance * 500);
            document.getElementById('reward').innerHTML = earnedZrl + ' <span style="font-size: 18px; font-weight: 500;">ZRL</span>';
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }
    </script>
</body>
</html>
