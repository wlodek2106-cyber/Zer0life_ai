<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zer0Life Run</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-base: #060608;
            --card-surface: #101015;
            --border-color: #22222f;
            --accent-green: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.15);
            --text-primary: #f3f3f6;
            --text-secondary: #7e7e93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 20px;
        }

        .header {
            text-align: center;
            margin-top: 10px;
        }

        .brand-badge {
            display: inline-block;
            background: rgba(0, 255, 102, 0.1);
            color: var(--accent-green);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 6px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            margin-bottom: 12px;
            border: 1px solid rgba(0, 255, 102, 0.2);
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .main-card {
            width: 100%;
            max-width: 380px;
            background: var(--card-surface);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .main-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-green), transparent);
        }

        .balance-section {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .balance-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .balance-value {
            font-size: 38px;
            font-weight: 900;
            color: var(--accent-green);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .metric-group {
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .metric-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .metric-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 14px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            transition: background-color 0.3s;
        }

        .pulse-dot.active {
            background-color: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .actions {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn {
            width: 100%;
            background: var(--accent-green);
            color: #060608;
            border: none;
            border-radius: 16px;
            padding: 15px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s, opacity 0.2s;
            box-shadow: 0 4px 20px rgba(0, 255, 102, 0.3);
        }

        .btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        .btn-secondary {
            background: #1c1c24;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            box-shadow: none;
        }

        .btn-danger {
            background: #ff334b;
            box-shadow: 0 4px 20px rgba(255, 51, 75, 0.3);
            color: #ffffff;
        }

        /* Модальное окно вывода */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }
        .modal-content {
            background: var(--card-surface);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .modal-content h3 {
            margin-bottom: 15px;
            font-size: 18px;
            text-transform: uppercase;
        }
        .modal-input {
            width: 100%;
            background: #060608;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-size: 13px;
            margin-bottom: 15px;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-badge">Zer0Life Labs • Solana</div>
        <h1>Run Tracker</h1>
    </div>

    <div class="main-card">
        <!-- Общий баланс токенов -->
        <div class="balance-section">
            <div class="balance-label">Общий баланс ZRL</div>
            <div class="balance-value" id="totalBalance">0</div>
        </div>

        <div class="metric-group">
            <span class="metric-label">Текущая пробежка</span>
            <span class="metric-value" id="currentDist">0.00 км</span>
        </div>

        <div class="metric-group">
            <span class="metric-label">Награда за сессию</span>
            <span class="metric-value" id="currentReward">0 ZRL</span>
        </div>

        <div class="status-indicator">
            <div class="pulse-dot" id="statusDot"></div>
            <span id="statusText">Ожидание старта</span>
        </div>
    </div>

    <div class="actions">
        <button class="btn" id="actionBtn" onclick="toggleRun()">Начать пробежку</button>
        <button class="btn btn-secondary" onclick="openWithdrawModal()">Вывод на Phantom (Solana)</button>
    </div>

    <!-- Модальное окно вывода -->
    <div class="modal" id="withdrawModal">
        <div class="modal-content">
            <h3>Вывод ZRL в сеть Solana</h3>
            <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 15px;">Введите ваш Solana-адрес кошелька (Phantom), чтобы вывести токены.</p>
            <input type="text" id="solanaAddress" class="modal-input" placeholder="Введите Solana адрес...">
            <button class="btn" onclick="submitWithdraw()">Запросить вывод</button>
            <button class="btn btn-secondary" style="margin-top: 8px;" onclick="closeWithdrawModal()">Отмена</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let isRunning = false;
        let watchId = null;
        let sessionDistance = 0;
        let lastPosition = null;
        let lastTime = null;

        // Загружаем сохраненный баланс из памяти телефона
        let userBalance = parseFloat(localStorage.getItem('zrl_balance')) || 0;
        updateBalanceUI();

        function updateBalanceUI() {
            document.getElementById('totalBalance').innerText = Math.floor(userBalance);
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function toggleRun() {
            const btn = document.getElementById('actionBtn');
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            if (!isRunning) {
                if (!navigator.geolocation) {
                    alert("Геолокация не поддерживается вашим устройством");
                    return;
                }

                isRunning = true;
                sessionDistance = 0;
                lastPosition = null;
                lastTime = null;

                btn.innerText = "Завершить и сохранить ZRL";
                btn.className = "btn btn-danger";
                dot.classList.add('active');
                text.innerText = "Античит активен (бег)...";

                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const { latitude, longitude, accuracy } = position.coords;
                        const currentTime = Date.now();
                        
                        if (accuracy > 20) return;

                        if (lastPosition && lastTime) {
                            const dist = calculateDistance(lastPosition.lat, lastPosition.lon, latitude, longitude);
                            const timeDiffHours = (currentTime - lastTime) / (1000 * 60 * 60);
                            
                            if (timeDiffHours > 0) {
                                const speedKmh = dist / timeDiffHours;
                                if (speedKmh > 17) {
                                    text.innerText = "⚠️ Слишком быстро! Сбавьте темп.";
                                    lastPosition = { lat: latitude, lon: longitude };
                                    lastTime = currentTime;
                                    return;
                                } else {
                                    text.innerText = "Трекинг активен (бег)...";
                                }
                            }

                            if (dist > 0.01) { 
                                sessionDistance += dist;
                                updateSessionUI();
                            }
                        }

                        lastPosition = { lat: latitude, lon: longitude };
                        lastTime = currentTime;
                    },
                    (error) => {
                        console.error(error);
                        alert("Включите GPS-модуль.");
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            } else {
                if (watchId !== null) {
                    navigator.geolocation.clearWatch(watchId);
                }
                isRunning = false;

                // Начисляем заработанные за сессию токены к общему балансу
                const earnedZrl = Math.floor(sessionDistance * 500);
                userBalance += earnedZrl;
                localStorage.setItem('zrl_balance', userBalance);
                updateBalanceUI();

                // Сбрасываем сессию UI
                btn.innerText = "Начать пробежку";
                btn.className = "btn";
                dot.classList.remove('active');
                text.innerText = "Тренировка завершена!";

                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }

                alert(`Отличная работа! На ваш баланс зачислено ${earnedZrl} ZRL.`);
                sessionDistance = 0;
                updateSessionUI();
            }
        }

        function updateSessionUI() {
            document.getElementById('currentDist').innerText = sessionDistance.toFixed(2) + " км";
            const earnedZrl = Math.floor(sessionDistance * 500);
            document.getElementById('currentReward').innerText = earnedZrl + " ZRL";
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
        }

        function openWithdrawModal() {
            document.getElementById('withdrawModal').style.display = 'flex';
        }

        function closeWithdrawModal() {
            document.getElementById('withdrawModal').style.display = 'none';
        }

        function submitWithdraw() {
            const address = document.getElementById('solanaAddress').value.trim();
            if (address.length < 30) {
                alert("Пожалуйста, введите корректный Solana адрес кошелька Phantom.");
                return;
            }
            if (userBalance <= 0) {
                alert("У вас недостаточно ZRL для вывода.");
                return;
            }

            alert(`Запрос на вывод ${Math.floor(userBalance)} ZRL на адрес ${address.substring(0, 6)}... успешно создан!`);
            userBalance = 0;
            localStorage.setItem('zrl_balance', userBalance);
            updateBalanceUI();
            closeWithdrawModal();
        }
    </script>
</body>
</html>
