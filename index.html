<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zer0life Run</title>
    <!-- Подключаем библиотеку Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0c10;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .main-container {
            flex-grow: 1;
            background-image: url('https://i.postimg.cc/J00FbBRZ/IMG-8899.jpg'); 
            background-size: cover;
            background-position: center top;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            transition: opacity 0.5s ease;
        }

        .main-container::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, rgba(11, 12, 16, 1) 10%, rgba(11, 12, 16, 0.8) 40%, transparent 100%);
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            padding: 0 24px 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            font-size: 48px;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            text-align: center;
            line-height: 0.9;
            margin-bottom: 8px;
            transform: skewX(-5deg);
        }

        .title-white {
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .title-green {
            color: #a8f07a;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .subtitle {
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 32px;
            opacity: 0.8;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background-color: #a8f07a;
            color: #000000;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div class="main-container" id="welcome-screen">
        <div class="content">
            <div class="title">
                <div class="title-white">ZERØLIFE</div>
                <div class="title-green">RUN</div>
            </div>
            
            <div class="subtitle">Move to Earn</div>

            <!-- Добавили ID для управления из JavaScript -->
            <button class="btn btn-primary" id="start-btn">
                Get Started
            </button>
        </div>
    </div>

    <script>
        // Инициализируем Telegram Web App
        const tg = window.Telegram.WebApp;
        
        // Разворачиваем приложение на весь экран телефона
        tg.expand(); 
        
        // Сообщаем Telegram, что приложение готово к отображению
        tg.ready(); 

        const startBtn = document.getElementById('start-btn');
        const welcomeScreen = document.getElementById('welcome-screen');

        // Обработчик нажатия на кнопку "Get Started"
        startBtn.addEventListener('click', () => {
            // Легкая вибрация телефона при клике
            tg.HapticFeedback.impactOccurred('medium');
            
            // Визуальный отклик кнопки
            startBtn.innerText = "Loading...";
            startBtn.style.opacity = "0.7";
            
            // Получаем имя пользователя из Telegram (если доступно)
            const userName = tg.initDataUnsafe?.user?.first_name || 'Runner';

            // Имитация загрузки перед переходом на следующий экран
            setTimeout(() => {
                alert(`Welcome, ${userName}! Let's start earning.`);
                // Здесь мы позже добавим код для скрытия этого экрана и показа главного меню
            }, 500);
        });
    </script>

</body>
</html>
