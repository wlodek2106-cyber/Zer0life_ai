<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zer0Life Run - Minimal Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --neon-green: #39ff14;
            --bg-base: #030303;
            --panel-bg: #0a0a0a;
        }
        body { 
            background-color: var(--bg-base); 
            color: #ffffff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            /* Легкий градиентный фон как на скрине */
            background-image: radial-gradient(circle at 50% 100%, rgba(57, 255, 20, 0.03) 0%, transparent 50%);
        }
        .text-glow { text-shadow: 0 0 20px rgba(57, 255, 20, 0.5); }
        .box-glow { box-shadow: 0 0 15px rgba(57, 255, 20, 0.2); }
        
        /* Кастомная пунктирная рамка */
        .dashed-border {
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='16' ry='16' stroke='%2339ff14' stroke-width='2' stroke-dasharray='8%2c 8' stroke-dashoffset='0' stroke-opacity='0.5' stroke-linecap='square'/%3e%3c/svg%3e");
            border-radius: 16px;
        }
    </style>
</head>
<body class="h-screen w-full flex justify-center items-center overflow-hidden">

    <div class="w-full max-w-md h-full flex flex-col p-5 relative justify-between">
        
        <div class="space-y-12 w-full pt-4">
            <!-- Header -->
            <header class="flex justify-between items-center w-full">
                <h1 class="text-sm font-black italic tracking-widest uppercase">Zer0Life Run</h1>
                <button class="bg-[#39ff14] text-black px-4 py-1.5 rounded-full text-[11px] font-black uppercase tracking-wider box-glow active:scale-95 transition-transform">
                    Connect
                </button>
            </header>

            <!-- Gear Card -->
            <div class="dashed-border p-5 flex justify-between items-center bg-[#050505]/50">
                <div>
                    <h2 class="text-[#39ff14] font-bold text-xs uppercase tracking-widest mb-1">Zer0Life Gear</h2>
                    <p class="text-gray-500 text-[9px] uppercase tracking-wider">Move to Earn • ZRL Token</p>
                </div>
                <div class="flex items-center space-x-3">
                    <!-- Иконка персонажа -->
                    <div class="w-6 h-8 flex flex-col items-center justify-center">
                        <div class="w-3 h-3 bg-[#fcd0a1] rounded-full border border-black z-10 mb-[-2px]"></div>
                        <div class="w-5 h-4 bg-[#39ff14] rounded-sm"></div>
                        <div class="flex space-x-1 mt-0.5">
                            <div class="w-1.5 h-3 bg-white"></div>
                            <div class="w-1.5 h-3 bg-white"></div>
                        </div>
                    </div>
                    <!-- Иконка энергии -->
                    <svg class="w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"></path></svg>
                </div>
            </div>
        </div>

        <!-- Main Dashboard -->
        <div class="w-full">
            <div class="bg-[#0a0a0a] border border-white/5 rounded-3xl p-6 flex flex-col relative mb-6 shadow-2xl">
                
                <div class="text-center mb-6">
                    <h3 class="text-gray-500 text-[10px] font-bold uppercase tracking-widest mb-2">Total ZRL Balance</h3>
                    <div class="text-5xl font-black text-[#39ff14] text-glow tracking-tighter">37</div>
                </div>

                <!-- Stats Rows -->
                <div class="space-y-2 mb-6">
                    <div class="flex justify-between items-center bg-[#111111] rounded-xl p-4">
                        <span class="text-gray-500 text-[10px] font-bold uppercase tracking-wider">Distance</span>
                        <span class="font-bold text-sm">0.00 km</span>
                    </div>
                    <div class="flex justify-between items-center bg-[#111111] rounded-xl p-4">
                        <span class="text-gray-500 text-[10px] font-bold uppercase tracking-wider">Session Reward</span>
                        <span class="font-bold text-sm">0 ZRL</span>
                    </div>
                </div>

                <!-- Status -->
                <div class="flex items-center justify-center space-x-2">
                    <div class="w-1.5 h-1.5 rounded-full bg-gray-500"></div>
                    <span class="text-[9px] text-gray-500 font-bold uppercase tracking-widest">Ready to start</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="space-y-3 pb-6">
                <button class="w-full bg-[#39ff14] text-black font-black text-sm py-4 rounded-2xl uppercase tracking-widest transition-transform active:scale-95 box-glow">
                    Start Run
                </button>
                <button class="w-full bg-[#0a0a0a] border border-white/10 text-white font-bold text-xs py-4 rounded-2xl uppercase tracking-widest transition-transform active:scale-95">
                    Withdraw to Wallet
                </button>
            </div>
        </div>

    </div>
</body>
</html>
