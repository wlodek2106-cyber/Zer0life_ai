<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zer0life Run</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0c10;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Контейнер с вашим фоновым изображением */
        .main-container {
            flex-grow: 1;
            background-image: url('https://i.postimg.cc/J00FbBRZ/IMG-8899.jpg'); 
            background-size: cover;
            background-position: center top;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        /* Темный градиент снизу */
        .main-container::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, rgba(11, 12, 16, 1) 10%, rgba(11, 12, 16, 0.8) 40%, transparent 100%);
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            padding: 0 24px 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            font-size: 48px;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            text-align: center;
            line-height: 0.9;
            margin-bottom: 8px;
            transform: skewX(-5deg);
        }

        .title-white {
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .title-green {
            color: #a8f07a;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .subtitle {
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 32px;
            opacity: 0.8;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: #a8f07a;
            color: #000000;
            margin-bottom: 12px;
        }

        .btn-secondary {
            background-color: #1a1c23;
            color: #ffffff;
            border: 1px solid #2d303b;
        }

        .tg-icon {
            width: 20px;
            height: 20px;
            fill: #a8f07a;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="content">
            <div class="title">
                <div class="title-white">ZERØLIFE</div>
                <div class="title-green">RUN</div>
            </div>
            
            <div class="subtitle">Move to Earn</div>

            <button class="btn btn-primary">
                Get Started
            </button>
            
            <button class="btn btn-secondary">
                <svg class="tg-icon" viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.19-.08-.05-.19-.02-.27 0-.12.03-1.99 1.25-5.61 3.66-.53.36-1.01.53-1.44.52-.47-.01-1.38-.26-2.05-.48-.83-.27-1.48-.42-1.42-.89.03-.25.38-.51 1.07-.78 4.2-1.82 7-3.02 8.4-3.61 4-.1.71-2.73.54-3.55.51z"/>
                </svg>
                Login with Telegram
            </button>
        </div>
    </div>

</body>
</html>
