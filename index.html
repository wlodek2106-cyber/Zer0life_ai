<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zer0life Run - Onboarding</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800;1,900&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0c10;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .main-container {
            flex-grow: 1;
            background-image: url('./assets/zerolife-run-race-mascot.jpeg');
            background-size: cover;
            background-position: center center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            isolation: isolate;
        }

        .main-container::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to top, #05070a 15%, rgba(5,7,10,0.8) 40%, transparent 100%);
            z-index: 1;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 2;
            padding: 0 24px 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
        }

        .title-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 36px;
            line-height: 0.95;
            font-family: 'Montserrat', sans-serif;
        }

        .title-white {
            color: #ffffff;
            font-size: 52px;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .title-green {
            color: #9bf864;
            font-size: 52px;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
            margin-top: -2px;
        }

        .subtitle {
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-top: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .btn {
            width: 100%;
            padding: 18px;
            border-radius: 14px;
            border: none;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s ease-in-out;
            box-shadow: 0 4px 20px rgba(155, 248, 100, 0.2);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background-color: #9bf864;
            color: #000000;
        }

        /* Welcome screen: keep the race mascot before entry, with the existing start flow intact. */
        .main-container::before {
            top: 0;
            bottom: 0;
            height: auto;
            background:
                linear-gradient(180deg, rgba(4,8,4,0.08) 0%, rgba(4,8,4,0.03) 34%, rgba(5,7,10,0.48) 68%, #05070a 100%),
                linear-gradient(90deg, rgba(4,8,4,0.12), transparent 54%, rgba(4,8,4,0.12));
        }

        .content {
            width: calc(100% - 28px);
            margin: 0 14px 18px;
            padding: 24px 18px 20px;
            border: 1px solid rgba(197,255,86,0.26);
            border-radius: 25px;
            background: linear-gradient(145deg, rgba(15,22,14,0.72), rgba(5,8,6,0.9));
            backdrop-filter: blur(14px) saturate(125%);
            -webkit-backdrop-filter: blur(14px) saturate(125%);
            box-shadow:
                inset 0 1px rgba(255,255,255,0.16),
                inset 1px 0 rgba(197,255,86,0.07),
                0 24px 48px rgba(0,0,0,0.5),
                0 0 26px rgba(197,255,86,0.08);
        }

        .title-group {
            margin-bottom: 20px;
        }

        .title-white,
        .title-green {
            font-size: clamp(38px, 12vw, 48px);
            text-shadow: 0 4px 18px rgba(0,0,0,0.72);
        }

        .subtitle {
            color: #d9f2bb;
            letter-spacing: 0.24em;
        }

        .btn {
            min-height: 56px;
            border-radius: 15px;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        .btn-primary {
            border: 1px solid rgba(244,255,214,0.5);
            background: linear-gradient(115deg, #d8ff86, #b7f54a 58%, #a5e43b);
            color: #10170a;
            box-shadow:
                inset 0 1px rgba(255,255,255,0.55),
                inset 0 -3px rgba(63,99,17,0.17),
                0 7px 0 rgba(0,0,0,0.22),
                0 16px 28px rgba(156,227,65,0.22);
        }

        .btn:active {
            transform: translateY(2px) scale(0.99);
            box-shadow: inset 0 1px rgba(255,255,255,0.32), 0 4px 0 rgba(0,0,0,0.18), 0 9px 16px rgba(0,0,0,0.26);
        }

        .btn:focus-visible {
            outline: 2px solid #e5ffb0;
            outline-offset: 3px;
        }

        @media (max-height: 700px) {
            .content {
                margin-bottom: 10px;
                padding: 17px 16px 15px;
            }

            .title-group {
                margin-bottom: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container" id="welcome-screen">
        <div class="content">
            <div class="title-group">
                <div class="title-white">ZERØLIFE</div>
                <div class="title-green">RUN</div>
                <div class="subtitle">Move to Earn</div>
            </div>

            <button class="btn btn-primary" id="start-btn">
                Get Started
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        
        if (tg.disableVerticalSwipes) {
            tg.disableVerticalSwipes();
        }
        
        tg.ready(); 

        const startBtn = document.getElementById('start-btn');
        const incomingParams = new URLSearchParams(window.location.search);
        const incomingReferral = incomingParams.get('ref') || tg.initDataUnsafe?.start_param || '';
        const referralMatch = String(incomingReferral).match(/(?:ref[_-]?)?([A-F0-9]{10})$/i);
        startBtn.addEventListener('click', () => {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            startBtn.innerText = "Loading...";
            startBtn.style.opacity = "0.7";
            
            setTimeout(() => { 
                const dashboardUrl = new URL('dashboard.html', window.location.href);
                dashboardUrl.searchParams.set('build', 'affiliate-v2');
                if (referralMatch) {
                    dashboardUrl.searchParams.set('ref', referralMatch[1].toUpperCase());
                }
                window.location.href = dashboardUrl.toString();
            }, 500);
        });
    </script>
</body>
</html>
