<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zer0Life Run</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: #141419;
            --accent: #00ff66;
            --text-main: #ffffff;
            --text-muted: #8c8c9e;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid #22222d;
            border-radius: 20px;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
            color: var(--text-main);
        }
        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }
        .metric-box {
            background: #1c1c24;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid #2a2a38;
        }
        .metric-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .metric-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
        }
        .btn {
            width: 100%;
            background: var(--accent);
            color: #000000;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.8;
        }
        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid #2a2a38;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Zer0Life Run ⚡️</h1>
        <div class="subtitle">Уличный трекер тренировок</div>

        <div class="metric-box">
            <div class="metric-label">Пройдено дистанции</div>
            <div class="metric-value" id="distance">0.00 км</div>
        </div>

        <div class="metric-box">
            <div class="metric-label">Заработано ZRL</div>
            <div class="metric-value" id="reward">0 ZRL</div>
        </div>

        <button class="btn" id="startBtn" onclick="toggleRun()">Начать пробежку</button>
        <button class="btn btn-secondary" id="finishBtn" style="display:none;" onclick="finishRun()">Завершить и забрать</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let isRunning = false;
        let watchId = null;
        let totalDistance = 0; // в км
        let lastPosition = null;

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Радиус Земли в км
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function toggleRun() {
            if (!isRunning) {
                // Старт
                if (!navigator.geolocation) {
                    alert("Геолокация не поддерживается вашим устройством");
                    return;
                }
                
                isRunning = true;
                totalDistance = 0;
                lastPosition = null;
                
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('finishBtn').style.display = 'block';

                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        const { latitude, longitude } = position.coords;
                        if (lastPosition) {
                            const dist = calculateDistance(lastPosition.lat, lastPosition.lon, latitude, longitude);
                            // Игнорируем погрешность GPS меньше 3 метров за обновление
                            if (dist > 0.003) {
                                totalDistance += dist;
                                updateUI();
                            }
                        }
                        lastPosition = { lat: latitude, lon: longitude };
                    },
                    (error) => {
                        console.error(error);
                        alert("Ошибка получения GPS: включите геолокацию.");
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            }
        }

        function updateUI() {
            document.getElementById('distance').innerText = totalDistance.toFixed(2) + " км";
            const earnedZrl = Math.floor(totalDistance * 500);
            document.getElementById('reward').innerText = earnedZrl + " ZRL";
        }

        function finishRun() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
            }
            isRunning = false;

            const finalData = {
                distance: parseFloat(totalDistance.toFixed(2)),
                reward: Math.floor(totalDistance * 500)
            };

            // Отправляем данные боту в Telegram
            tg.sendData(JSON.stringify(finalData));
            tg.close();
        }
    </script>
</body>
</html>
