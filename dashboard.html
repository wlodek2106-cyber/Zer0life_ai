<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zer0life Run - Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0c10;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .dashboard-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 20px 90px 20px; /* Отступ снизу для навигации */
            overflow-y: auto;
        }

        /* Header (Баланс и Кошелек) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .balance-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-image: url('https://i.postimg.cc/J00FbBRZ/IMG-8899.jpg'); /* Аватарка кота */
            background-size: cover;
            background-position: center;
            border: 2px solid #2d303b;
        }

        .balance-info {
            display: flex;
            flex-direction: column;
        }

        .balance-label {
            font-size: 12px;
            color: #8a8d98;
            margin-bottom: 2px;
        }

        .balance-amount {
            font-size: 24px;
            font-weight: 700;
        }

        .wallet-btn {
            background-color: #1a1c23;
            border: 1px solid #2d303b;
            border-radius: 12px;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .wallet-btn:active {
            transform: scale(0.95);
        }

        /* Карточка "Today's Run" */
        .run-card {
            background-color: #15171e;
            border: 1px solid rgba(168, 240, 122, 0.2);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .run-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 20px;
            box-shadow: inset 0 0 15px rgba(168, 240, 122, 0.05);
            pointer-events: none;
        }

        .run-header {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .run-stats-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .run-stats {
            display: flex;
            flex-direction: column;
        }

        .distance {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .earned-tokens {
            font-size: 14px;
            color: #a8f07a;
            font-weight: 600;
        }

        .claim-btn {
            background-color: #a8f07a;
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 10px 20px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        /* Прогресс уровня */
        .level-section {
            margin-bottom: 24px;
        }

        .level-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .level-xp {
            color: #8a8d98;
            font-size: 12px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: #1a1c23;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 48%; /* Процент заполнения (480/1000) */
            height: 100%;
            background: linear-gradient(90deg, #5fc342 0%, #a8f07a 100%);
            border-radius: 4px;
        }

        /* Центральное изображение */
        .hero-image-container {
            flex-grow: 1;
            border-radius: 20px;
            background-color: #1a1c23;
            /* Сюда нужно вставить ссылку на изображение кота со спины */
            background-image: url(''); 
            background-size: cover;
            background-position: center;
            position: relative;
            min-height: 200px;
            margin-bottom: 24px;
            overflow: hidden;
            border: 1px solid #2d303b;
        }

        /* Кнопка Start Run */
        .start-run-btn {
            background-color: #a8f07a;
            color: #000;
            border: none;
            border-radius: 16px;
            padding: 18px;
            width: 100%;
            font-size: 18px;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(168, 240, 122, 0.3);
        }

        /* Нижняя навигация */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0b0c10;
            border-top: 1px solid #1a1c23;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 0 24px 0; /* padding-bottom для iPhone */
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #8a8d98;
            font-size: 10px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #a8f07a;
        }

        .nav-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Header -->
        <div class="header">
            <div class="balance-section">
                <div class="avatar"></div>
                <div class="balance-info">
                    <span class="balance-label">ZRL Balance</span>
                    <span class="balance-amount">1,248.75</span>
                </div>
            </div>
            <div class="wallet-btn" id="wallet-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#a8f07a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path>
                    <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path>
                    <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path>
                </svg>
            </div>
        </div>

        <!-- Run Stats Card -->
        <div class="run-card">
            <div class="run-header">Today's Run</div>
            <div class="run-stats-container">
                <div class="run-stats">
                    <span class="distance">2.34 km</span>
                    <span class="earned-tokens">+12.6 ZRL</span>
                </div>
                <button class="claim-btn">Claim</button>
            </div>
        </div>

        <!-- Level Progress -->
        <div class="level-section">
            <div class="level-header">
                <span>Level 3</span>
                <span class="level-xp">480 / 1,000 XP</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill"></div>
            </div>
        </div>

        <!-- Hero Image -->
        <div class="hero-image-container">
            <!-- Пока здесь нет картинки кота со спины, будет темный фон -->
        </div>

        <!-- Start Run Button -->
        <button class="start-run-btn" id="start-run-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 4v.01"></path>
                <path d="m4 17 5-4 4 1 2-4"></path>
                <path d="M15 21v-4l-4-3-1-6 5-2"></path>
            </svg>
            Start Run
        </button>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            Home
        </div>
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            Run
        </div>
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="12" rx="2"></rect><path d="M12 8v12"></path><path d="M19 12H5"></path><path d="M12 8V4a2 2 0 0 1 2-2h4"></path></svg>
            Rewards
        </div>
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path></svg>
            Wallet
        </div>
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
            More
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        document.getElementById('start-run-btn').addEventListener('click', () => {
            tg.HapticFeedback.impactOccurred('heavy');
            // Здесь будет логика запуска таймера и GPS трекинга
            alert('GPS Tracker initialized! Time to run.');
        });

        document.getElementById('wallet-btn').addEventListener('click', () => {
            tg.HapticFeedback.impactOccurred('light');
            // Здесь будет вызов окна подключения Phantom Wallet
            alert('Connecting to Solana Phantom Wallet...');
        });
    </script>
</body>
</html>
