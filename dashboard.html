<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zer0life Run - Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0c10;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .dashboard-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 20px 20px 90px 20px;
            overflow-y: auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .balance-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-image: url('https://i.postimg.cc/J00FbBRZ/IMG-8899.jpg');
            background-size: cover;
            background-position: center;
            border: 2px solid #2d303b;
        }

        .balance-info {
            display: flex;
            flex-direction: column;
        }

        .balance-label {
            font-size: 12px;
            color: #8a8d98;
            margin-bottom: 2px;
        }

        .balance-amount {
            font-size: 24px;
            font-weight: 700;
        }

        .wallet-btn {
            background-color: #1a1c23;
            border: 1px solid #2d303b;
            border-radius: 12px;
            height: 44px;
            padding: 0 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
            font-weight: 600;
            color: #a8f07a;
        }

        .wallet-btn:active {
            transform: scale(0.95);
        }

        /* Карточка пробежки */
        .run-card {
            background-color: #15171e;
            border: 1px solid rgba(168, 240, 122, 0.2);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .run-header {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }
        
        #speed-warning {
            color: #ff4757;
            font-size: 12px;
            display: none;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .run-stats-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .run-stats {
            display: flex;
            flex-direction: column;
        }

        .distance {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .steps-count {
            font-size: 13px;
            color: #8a8d98;
            margin-bottom: 2px;
        }

        .earned-tokens {
            font-size: 14px;
            color: #a8f07a;
            font-weight: 600;
        }

        .claim-btn {
            background-color: #a8f07a;
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 10px 20px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .claim-btn:active {
            transform: scale(0.95);
        }

        /* Прогресс уровня */
        .level-section {
            margin-bottom: 24px;
        }

        .level-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .level-xp {
            color: #8a8d98;
            font-size: 12px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background-color: #1a1c23;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #5fc342 0%, #a8f07a 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* Центральное изображение */
        .hero-image-container {
            flex-grow: 1;
            border-radius: 20px;
            background-color: #1a1c23;
            background-image: url('https://i.postimg.cc/Y9H8xDw6/IMG-8907.jpg'); 
            background-size: cover;
            background-position: center;
            position: relative;
            min-height: 200px;
            margin-bottom: 24px;
            overflow: hidden;
            border: 1px solid #2d303b;
        }

        /* Кнопка Start Run */
        .start-run-btn {
            background-color: #a8f07a;
            color: #000;
            border: none;
            border-radius: 16px;
            padding: 18px;
            width: 100%;
            font-size: 18px;
            font-weight: 800;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(168, 240, 122, 0.3);
            transition: all 0.3s;
        }

        .start-run-btn.active-run {
            background-color: #ff4757;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.3);
        }

        /* Модальные окна */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background-color: #15171e;
            width: 100%;
            max-height: 80vh;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 20px 40px 20px;
            overflow-y: auto;
            border-top: 1px solid rgba(168, 240, 122, 0.3);
            box-sizing: border-box;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
        }

        .close-modal {
            background: none;
            border: none;
            color: #8a8d98;
            font-size: 24px;
            cursor: pointer;
        }

        .level-card-item {
            background-color: #1a1c23;
            border: 1px solid #2d303b;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .level-card-item.active-tier {
            border-color: #a8f07a;
            background-color: rgba(168, 240, 122, 0.05);
        }

        .tier-info h4 {
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: 700;
        }

        .tier-info p {
            margin: 0;
            font-size: 12px;
            color: #8a8d98;
        }

        .tier-badge {
            font-size: 13px;
            font-weight: 700;
            color: #a8f07a;
            background: rgba(168, 240, 122, 0.1);
            padding: 6px 12px;
            border-radius: 10px;
        }

        .wallet-option-btn {
            background-color: #1a1c23;
            border: 1px solid #2d303b;
            border-radius: 16px;
            padding: 16px;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 16px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 12px;
            transition: 0.2s;
        }

        .wallet-option-btn:hover {
            border-color: #a8f07a;
        }

        .disconnect-btn {
            background-color: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: #ff4757;
            border-radius: 16px;
            padding: 16px;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Нижняя навигация */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0b0c10;
            border-top: 1px solid #1a1c23;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 0 24px 0; 
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #8a8d98;
            font-size: 10px;
            cursor: pointer;
        }

        .nav-item.active {
            color: #a8f07a;
        }
        
        .nav-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Header -->
        <div class="header">
            <div class="balance-section">
                <div class="avatar"></div>
                <div class="balance-info">
                    <span class="balance-label">ZRL Balance</span>
                    <span class="balance-amount" id="total-balance">0.00</span>
                </div>
            </div>
            <!-- Кнопка кошелька -->
            <div class="wallet-btn" id="wallet-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path>
                    <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path>
                    <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path>
                </svg>
                <span id="wallet-btn-text">Connect</span>
            </div>
        </div>

        <!-- Run Stats Card -->
        <div class="run-card">
            <div class="run-header">
                Today's Run
                <span id="speed-warning">Too fast! (Anti-cheat)</span>
            </div>
            <div class="run-stats-container">
                <div class="run-stats">
                    <span class="distance" id="today-distance">0.00 km</span>
                    <span class="steps-count" id="steps-display">Steps: 0</span>
                    <span class="earned-tokens" id="today-earned">+0.00 ZRL</span>
                </div>
                <button class="claim-btn" id="claim-btn">Claim</button>
            </div>
        </div>

        <!-- Level Progress -->
        <div class="level-section">
            <div class="level-header">
                <span id="current-level-text">Level 1</span>
                <span class="level-xp" id="level-progress-text">0.00 / 5.00 km</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="level-progress-bar"></div>
            </div>
        </div>

        <!-- Hero Image -->
        <div class="hero-image-container"></div>

        <!-- Start Run Button -->
        <button class="start-run-btn" id="start-run-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 4v.01"></path>
                <path d="m4 17 5-4 4 1 2-4"></path>
                <path d="M15 21v-4l-4-3-1-6 5-2"></path>
            </svg>
            <span id="start-btn-text">Start Run</span>
        </button>
    </div>

    <!-- Модальное окно Rewards -->
    <div class="modal-overlay" id="rewards-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">Levels & Rewards</span>
                <button class="close-modal" id="close-rewards">&times;</button>
            </div>
            <div id="levels-list-container"></div>
        </div>
    </div>

    <!-- Модальное окно Wallet с поддержкой селектора сетей/кошельков -->
    <div class="modal-overlay" id="wallet-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" id="wallet-modal-title">Connect Wallet</span>
                <button class="close-modal" id="close-wallet">&times;</button>
            </div>
            <div id="wallet-modal-body"></div>
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="bottom-nav">
        <div class="nav-item" id="nav-rewards">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="12" rx="2"></rect><path d="M12 8v12"></path><path d="M19 12H5"></path><path d="M12 8V4a2 2 0 0 1 2-2h4"></path></svg>
            Rewards
        </div>
        <div class="nav-item active" id="nav-wallet">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"></path><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"></path><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"></path></svg>
            Wallet
        </div>
        <div class="nav-item" id="nav-more">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
            More
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const ZRL_PER_KM = 500;
        const METERS_PER_STEP = 0.00075; 
        const MAX_SPEED_KMH = 14; 
        
        const LEVELS = [
            { level: 1, targetKm: 5, reward: "Standard" },
            { level: 2, targetKm: 20, reward: "Standard" },
            { level: 3, targetKm: 50, reward: "Standard" },
            { level: 4, targetKm: 100, reward: "+10,000 ZRL Bonus (7d hold)" },
            { level: 5, targetKm: 150, reward: "Elite Tier" },
            { level: 6, targetKm: 200, reward: "Max Legend Tier" }
        ];

        let totalBalance = parseFloat(localStorage.getItem('zrl_total_balance')) || 0.00;
        let todayDistance = parseFloat(localStorage.getItem('zrl_today_distance')) || 0.00;
        let totalDistance = parseFloat(localStorage.getItem('zrl_total_distance')) || 0.00; 
        let unclaimedZRL = parseFloat(localStorage.getItem('zrl_unclaimed')) || 0.00;
        let todaySteps = parseInt(localStorage.getItem('zrl_today_steps')) || 0;
        let connectedWallet = localStorage.getItem('zrl_wallet') || null;
        
        let isRunning = false;
        let lastMotionTime = 0;
        let watchId = null;
        let currentSpeedKmh = 0;
        let lastLat = null;
        let lastLon = null;
        let lastTime = null;

        const balanceEl = document.getElementById('total-balance');
        const todayDistEl = document.getElementById('today-distance');
        const stepsEl = document.getElementById('steps-display');
        const todayEarnedEl = document.getElementById('today-earned');
        const levelTextEl = document.getElementById('current-level-text');
        const progressTextEl = document.getElementById('level-progress-text');
        const progressBarEl = document.getElementById('level-progress-bar');
        const warningEl = document.getElementById('speed-warning');
        const startBtn = document.getElementById('start-run-btn');
        const startBtnText = document.getElementById('start-btn-text');

        function saveData() {
            localStorage.setItem('zrl_total_balance', totalBalance);
            localStorage.setItem('zrl_today_distance', todayDistance);
            localStorage.setItem('zrl_total_distance', totalDistance);
            localStorage.setItem('zrl_unclaimed', unclaimedZRL);
            localStorage.setItem('zrl_today_steps', todaySteps);
        }

        function updateWalletUI() {
            if (connectedWallet) {
                const shortAddr = connectedWallet.substring(0, 4) + '...' + connectedWallet.substring(connectedWallet.length - 4);
                document.getElementById('wallet-btn-text').innerText = shortAddr;
            } else {
                document.getElementById('wallet-btn-text').innerText = 'Connect';
            }
        }

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; 
        }

        function getCurrentLevelObj() {
            let currentLevelObj = LEVELS[0];
            for (let i = 0; i < LEVELS.length; i++) {
                if (totalDistance < LEVELS[i].targetKm) {
                    currentLevelObj = LEVELS[i];
                    break;
                }
                if (i === LEVELS.length - 1) currentLevelObj = LEVELS[i]; 
            }
            return currentLevelObj;
        }

        function updateUI() {
            balanceEl.innerText = totalBalance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            todayDistEl.innerText = todayDistance.toFixed(2) + ' km';
            stepsEl.innerText = 'Steps: ' + todaySteps;
            todayEarnedEl.innerText = '+' + unclaimedZRL.toFixed(2) + ' ZRL';

            let currentLevelObj = getCurrentLevelObj();
            let prevLevelKm = currentLevelObj.level === 1 ? 0 : LEVELS[currentLevelObj.level - 2].targetKm;
            let kmInCurrentLevel = totalDistance - prevLevelKm;
            let kmNeededForLevel = currentLevelObj.targetKm - prevLevelKm;
            
            let progressPercent = (kmInCurrentLevel / kmNeededForLevel) * 100;
            if (progressPercent > 100) progressPercent = 100;

            levelTextEl.innerText = 'Level ' + currentLevelObj.level;
            progressTextEl.innerText = `${totalDistance.toFixed(2)} / ${currentLevelObj.targetKm} km`;
            progressBarEl.style.width = `${progressPercent}%`;
            updateWalletUI();
        }

        function renderRewardsList() {
            const container = document.getElementById('levels-list-container');
            container.innerHTML = '';
            let currentLevelObj = getCurrentLevelObj();

            LEVELS.forEach(lvl => {
                const isActive = lvl.level === currentLevelObj.level;
                const isPassed = totalDistance >= lvl.targetKm;

                let badgeText = lvl.reward;
                if (isPassed && !isActive) badgeText = "Completed ✓";
                if (isActive) badgeText = "Current Tier";

                const card = document.createElement('div');
                card.className = `level-card-item ${isActive ? 'active-tier' : ''}`;
                card.innerHTML = `
                    <div class="tier-info">
                        <h4>Level ${lvl.level} (${lvl.targetKm} km)</h4>
                        <p>${lvl.reward}</p>
                    </div>
                    <div class="tier-badge" style="${isPassed && !isActive ? 'color: #8a8d98; background: #2d303b;' : ''}">${badgeText}</div>
                `;
                container.appendChild(card);
            });
        }

        // Подключение к сети Solana через встроенный provider (Phantom / Solflare / др.)
        async function connectSolanaWallet(providerName) {
            tg.HapticFeedback.impactOccurred('medium');

            try {
                let provider = null;
                
                if (providerName === 'Phantom') {
                    provider = window.phantom?.solana || window.solana;
                } else if (providerName === 'Solflare') {
                    provider = window.solflare;
                }

                if (provider) {
                    const response = await provider.connect();
                    connectedWallet = response.publicKey.toString();
                    localStorage.setItem('zrl_wallet', connectedWallet);
                    walletModal.style.display = 'none';
                    updateUI();
                    tg.showAlert(`Connected to Solana: ${connectedWallet.substring(0, 4)}...`);
                } else {
                    // Если провайдер не найден в окружении, предлагаем запустить автоконнект через Web3 объект или ручной ввод
                    alert(`${providerName} wallet not found. Please open this app inside Phantom Browser or install the wallet.`);
                }
            } catch (err) {
                console.error(err);
                tg.showAlert("Connection failed or rejected.");
            }
        }

        function renderWalletModal() {
            const body = document.getElementById('wallet-modal-body');
            const title = document.getElementById('wallet-modal-title');
            body.innerHTML = '';

            if (connectedWallet) {
                title.innerText = 'Solana Wallet';
                body.innerHTML = `
                    <div style="background: #1a1c23; border: 1px solid #2d303b; border-radius: 16px; padding: 16px; margin-bottom: 20px;">
                        <span style="font-size: 12px; color: #8a8d98;">Connected Address (Solana Network)</span>
                        <div style="font-size: 14px; font-weight: 700; color: #a8f07a; word-break: break-all; margin-top: 4px;">${connectedWallet}</div>
                    </div>
                    <button class="disconnect-btn" id="disconnect-wallet-btn">Disconnect Wallet</button>
                `;
                document.getElementById('disconnect-wallet-btn').addEventListener('click', () => {
                    tg.HapticFeedback.notificationOccurred('warning');
                    localStorage.removeItem('zrl_wallet');
                    connectedWallet = null;
                    walletModal.style.display = 'none';
                    updateUI();
                });
            } else {
                title.innerText = 'Connect Wallet (Solana)';
                body.innerHTML = `
                    <button class="wallet-option-btn" id="connect-phantom">
                        <span style="font-size: 18px;">👻</span> Phantom Wallet
                    </button>
                    <button class="wallet-option-btn" id="connect-solflare">
                        <span style="font-size: 18px;">☀️</span> Solflare Wallet
                    </button>
                `;
                
                document.getElementById('connect-phantom').addEventListener('click', () => connectSolanaWallet('Phantom'));
                document.getElementById('connect-solflare').addEventListener('click', () => connectSolanaWallet('Solflare'));
            }
        }

        function handlePositionUpdate(position) {
            const currentLat = position.coords.latitude;
            const currentLon = position.coords.longitude;
            const currentTime = position.timestamp;

            if (lastLat !== null && lastLon !== null && lastTime !== null) {
                const distanceKm = getDistanceFromLatLonInKm(lastLat, lastLon, currentLat, currentLon);
                const timeDiffHours = (currentTime - lastTime) / (1000 * 60 * 60);

                if (timeDiffHours > 0) {
                    currentSpeedKmh = distanceKm / timeDiffHours;
                    if (currentSpeedKmh > MAX_SPEED_KMH) {
                        warningEl.style.display = 'block';
                    } else {
                        warningEl.style.display = 'none';
                    }
                }
            }

            lastLat = currentLat;
            lastLon = currentLon;
            lastTime = currentTime;
        }

        function handleMotion(event) {
            if (!isRunning) return;

            if (currentSpeedKmh > MAX_SPEED_KMH) {
                warningEl.style.display = 'block';
                return;
            } else {
                warningEl.style.display = 'none';
            }

            const acc = event.accelerationIncludingGravity;
            if (!acc) return;

            const totalAcc = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
            const now = Date.now();

            if (totalAcc > 13.5 && (now - lastMotionTime) > 300) {
                lastMotionTime = now;
                todaySteps++;

                const stepKm = METERS_PER_STEP;
                todayDistance += stepKm;
                totalDistance += stepKm;
                unclaimedZRL += (stepKm * ZRL_PER_KM);

                updateUI();
                saveData();
            }
        }

        function stopRunning() {
            isRunning = false;
            startBtn.classList.remove('active-run');
            startBtnText.innerText = 'Start Run';
            window.removeEventListener('devicemotion', handleMotion);
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            warningEl.style.display = 'none';
        }

        startBtn.addEventListener('click', async () => {
            tg.HapticFeedback.impactOccurred('heavy');
            
            if (!isRunning) {
                if ("geolocation" in navigator) {
                    watchId = navigator.geolocation.watchPosition(
                        handlePositionUpdate, 
                        (err) => console.log(err), 
                        { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
                    );
                }

                if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                    try {
                        const response = await DeviceMotionEvent.requestPermission();
                        if (response === 'granted') {
                            window.addEventListener('devicemotion', handleMotion);
                            isRunning = true;
                            startBtn.classList.add('active-run');
                            startBtnText.innerText = 'Stop Run';
                        } else {
                            tg.showAlert("Motion permission is required to track your run.");
                        }
                    } catch (e) {
                        console.log(e);
                    }
                } else {
                    window.addEventListener('devicemotion', handleMotion);
                    isRunning = true;
                    startBtn.classList.add('active-run');
                    startBtnText.innerText = 'Stop Run';
                }
            } else {
                stopRunning();
            }
        });

        document.getElementById('claim-btn').addEventListener('click', () => {
            if (unclaimedZRL > 0) {
                tg.HapticFeedback.notificationOccurred('success');
                totalBalance += unclaimedZRL;
                unclaimedZRL = 0;
                
                updateUI();
                saveData();
                
                tg.showAlert('Tokens successfully claimed to your balance!');
            } else {
                tg.showAlert('No tokens to claim yet. Make some steps!');
            }
        });

        const rewardsModal = document.getElementById('rewards-modal');
        document.getElementById('nav-rewards').addEventListener('click', () => {
            tg.HapticFeedback.impactOccurred('light');
            renderRewardsList();
            rewardsModal.style.display = 'flex';
        });

        document.getElementById('close-rewards').addEventListener('click', () => {
            rewardsModal.style.display = 'none';
        });

        const walletModal = document.getElementById('wallet-modal');
        const openWalletModal = () => {
            tg.HapticFeedback.impactOccurred('light');
            renderWalletModal();
            walletModal.style.display = 'flex';
        };

        document.getElementById('wallet-btn').addEventListener('click', openWalletModal);
        document.getElementById('nav-wallet').addEventListener('click', openWalletModal);

        document.getElementById('close-wallet').addEventListener('click', () => {
            walletModal.style.display = 'none';
        });

        document.getElementById('nav-more').addEventListener('click', () => {
            tg.HapticFeedback.impactOccurred('light');
            alert('Zer0life Run v1.0. Cyberpunk Move-to-Earn.');
        });

        updateUI();
    </script>
</body>
</html>
