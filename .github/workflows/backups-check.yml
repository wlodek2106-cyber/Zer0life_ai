name: Private ledger backup checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  synthetic-backups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      # No production secrets, DBs or uploaded build artifacts.
      - run: python -m unittest discover -s tests -p 'test_wallet_backup.py' -v
